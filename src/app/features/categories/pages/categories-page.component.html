<app-page-header title="Categorias" subtitle="Agrupe as despesas por tipo de gasto.">
    <label for="categories-show-inactive" class="flex cursor-pointer items-center gap-2 text-sm text-muted-color">
        <p-toggleswitch
            inputId="categories-show-inactive"
            [ngModel]="showInactive()"
            (ngModelChange)="toggleInactive($event)"
        />
        Mostrar inativas
    </label>
    <p-button label="Nova categoria" icon="pi pi-plus" (onClick)="openCreate()" />
</app-page-header>

<div class="overflow-hidden surface-card">
    <p-table [value]="categories()" [loading]="loading()" dataKey="id" [rowHover]="true">
        <ng-template #header>
            <tr>
                <th>Nome</th>
                <th class="text-right sm:w-40"><span class="sr-only sm:not-sr-only">Ações</span></th>
            </tr>
        </ng-template>

        <ng-template #body let-category>
            <tr>
                <td>
                    <span class="font-medium" [class.text-muted-color]="!category.active">{{ category.name }}</span>
                    @if (!category.active) {
                        <p-tag value="Inativa" severity="warn" styleClass="ml-2" />
                    }
                    @if (category.isDefault) {
                        <p-tag
                            value="Padrão"
                            severity="secondary"
                            styleClass="ml-2"
                            pTooltip="Recebe as despesas lançadas sem categoria"
                            tooltipPosition="top"
                        />
                    }
                </td>
                <td class="text-right whitespace-nowrap">
                    @if (category.isDefault) {
                        <span class="text-sm text-muted-color">Não editável</span>
                    } @else if (!category.active) {
                        <p-button
                            icon="pi pi-replay"
                            label="Reativar"
                            size="small"
                            [text]="true"
                            [ariaLabel]="'Reativar ' + category.name"
                            (onClick)="reactivate(category)"
                        />
                        <p-button
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            [ariaLabel]="'Excluir ' + category.name"
                            pTooltip="Excluir"
                            tooltipPosition="top"
                            (onClick)="remove(category)"
                        />
                    } @else {
                        <p-button
                            icon="pi pi-pencil"
                            [text]="true"
                            [rounded]="true"
                            severity="secondary"
                            [ariaLabel]="'Renomear ' + category.name"
                            pTooltip="Renomear"
                            tooltipPosition="top"
                            (onClick)="openRename(category)"
                        />
                        <p-button
                            icon="pi pi-ban"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            [ariaLabel]="'Desativar ' + category.name"
                            pTooltip="Desativar"
                            tooltipPosition="top"
                            (onClick)="deactivate(category)"
                        />
                        <p-button
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            [ariaLabel]="'Excluir ' + category.name"
                            pTooltip="Excluir"
                            tooltipPosition="top"
                            (onClick)="remove(category)"
                        />
                    }
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="2" class="py-8 text-center text-muted-color">Nenhuma categoria encontrada.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-category-form-dialog [(visible)]="dialogVisible" [category]="editing()" (saved)="load()" />
