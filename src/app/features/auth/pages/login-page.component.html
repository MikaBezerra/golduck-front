<div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl border border-surface bg-surface-0 p-8 shadow-sm">
        <div class="mb-6 flex flex-col items-center gap-2 text-center">
            <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary-50 text-primary-700">
                <i class="pi pi-wallet text-2xl" aria-hidden="true"></i>
            </span>
            <h1 class="m-0 text-2xl font-semibold">Finanças</h1>
            <p class="m-0 text-muted-color">Entre para continuar</p>
        </div>

        @if (errorMessage(); as message) {
            <p-message severity="error" [text]="message" styleClass="mb-4" />
        }

        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
            <div class="flex flex-col gap-2">
                <label for="email" class="font-medium">E-mail</label>
                <input
                    pInputText
                    id="email"
                    type="email"
                    formControlName="email"
                    autocomplete="username"
                    [fluid]="true"
                />
                <app-field-error [control]="form.controls.email" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="font-medium">Senha</label>
                <p-password
                    inputId="password"
                    formControlName="password"
                    autocomplete="current-password"
                    [feedback]="false"
                    [toggleMask]="true"
                    [fluid]="true"
                />
                <app-field-error [control]="form.controls.password" />
            </div>

            <p-button type="submit" label="Entrar" icon="pi pi-sign-in" [loading]="submitting()" [fluid]="true" />
        </form>
    </div>
</div>
