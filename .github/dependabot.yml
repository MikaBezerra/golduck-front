# Atualizações semanais de dependências e de actions, com PRs para a develop.
# Os títulos saem como "chore(deps): ..." e "ci(deps): ...", aceitos pelo check de título.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Versão nova grande (major) do Angular, do PrimeNG e do angular-eslint, que acompanham o Angular, é feita
    # à mão com `ng update` (ele roda as migrações). O TypeScript fica na faixa que o Angular aceita, então só
    # recebe correções (patch); minor e major vêm junto com a atualização do Angular.
    ignore:
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: angular-eslint
        update-types: [version-update:semver-major]
      - dependency-name: primeng
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    # Cada pacote entra no primeiro grupo que combina: os do Angular sobem juntos (um sozinho quebra o build).
    groups:
      angular:
        patterns: ['@angular/*', angular-eslint]
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
