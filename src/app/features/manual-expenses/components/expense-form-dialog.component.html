<p-dialog
    [header]="expense() ? 'Editar despesa' : 'Nova despesa'"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: '34rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4" novalidate>
        <div class="flex flex-col gap-2">
            <label for="expense-title" class="font-medium">Descrição</label>
            <input
                pInputText
                id="expense-title"
                formControlName="title"
                [maxlength]="titleMaxLength"
                placeholder="Ex.: Aluguel"
                autocomplete="off"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.title" />
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-2">
                <label for="expense-amount" class="font-medium">Valor</label>
                <p-inputnumber
                    inputId="expense-amount"
                    formControlName="amount"
                    mode="currency"
                    currency="BRL"
                    locale="pt-BR"
                    [min]="0"
                    [max]="moneyMax"
                    placeholder="R$ 0,00"
                    [fluid]="true"
                />
                <app-field-error [control]="form.controls.amount" [messages]="moneyMessages" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="expense-month" class="font-medium">Mês</label>
                @if (expense(); as current) {
                    <p class="m-0 py-2">{{ current.month | month }}</p>
                } @else {
                    <p-datepicker
                        inputId="expense-month"
                        formControlName="month"
                        view="month"
                        dateFormat="MM 'de' yy"
                        [readonlyInput]="true"
                        appendTo="body"
                        [fluid]="true"
                    />
                    <app-field-error [control]="form.controls.month" />
                }
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <label for="expense-person" class="font-medium">Pessoa</label>
            <p-select
                inputId="expense-person"
                formControlName="personId"
                [options]="personOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Escolha a pessoa ou Compartilhada"
                [filter]="personOptions().length > 8"
                emptyMessage="Nenhuma pessoa cadastrada"
                appendTo="body"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.personId" />
        </div>

        @if (!expense() && replicateCount() > 1) {
            <div class="flex items-start gap-2 rounded-lg bg-emphasis p-3">
                <p-checkbox inputId="expense-replicate" formControlName="replicate" [binary]="true" />
                <label for="expense-replicate" class="cursor-pointer">
                    <span class="font-medium">Repetir todo mês até dezembro</span>
                    <span class="block text-sm text-muted-color">
                        Lança {{ replicateCount() }} despesas iguais, uma por mês, até {{ replicateUntil() }}.
                    </span>
                </label>
            </div>
        }

        <div class="flex justify-end gap-2">
            <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
            <p-button type="submit" label="Salvar" icon="pi pi-check" [loading]="saving()" />
        </div>
    </form>
</p-dialog>
