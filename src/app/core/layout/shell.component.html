<div class="flex min-h-dvh">
    <!-- Menu lateral fixo (telas grandes): um cartão de vidro flutuando sobre o fundo. -->
    <aside class="sticky top-0 hidden h-dvh w-72 shrink-0 p-4 pr-0 lg:block">
        <div class="surface-card flex h-full flex-col p-3">
            <app-brand-logo class="px-2 pt-2 pb-6" />
            <app-sidebar-nav class="flex-1 overflow-y-auto" idPrefix="side-" />
            <div class="mt-3 border-t border-line pt-3">
                <app-user-badge />
                <p-button
                    label="Sair"
                    icon="pi pi-sign-out"
                    [text]="true"
                    severity="secondary"
                    [fluid]="true"
                    styleClass="justify-start"
                    (onClick)="logout()"
                />
            </div>
        </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
        <header
            class="sticky top-0 z-20 flex min-h-16 items-center gap-3 border-b border-line bg-midnight/70 px-4 pt-[env(safe-area-inset-top)] backdrop-blur-xl sm:px-6 lg:min-h-20 lg:px-8"
        >
            <app-brand-logo class="lg:hidden" [compact]="true" />
            <div class="flex-1"></div>
            <app-month-picker />
        </header>

        <main class="flex-1 px-4 pt-5 pb-4 sm:px-6 lg:px-8 lg:pt-6 lg:pb-6">
            <div class="mx-auto max-w-6xl">
                <router-outlet />
            </div>
        </main>

        <!-- pb-28 no celular: espaço para a barra de navegação fixa no pé da tela. -->
        <app-footer class="pb-28 lg:pb-2" />
    </div>

    <!-- Celular e tablet: barra fixa embaixo + folha "Mais" com os cadastros e a conta. -->
    <app-bottom-nav [moreOpen]="moreOpen()" (more)="moreOpen.set(true)" />
    <p-drawer
        [(visible)]="moreOpen"
        position="bottom"
        header="Mais opções"
        styleClass="!h-auto !max-h-[85dvh] !rounded-t-3xl !border-line"
    >
        <app-sidebar-nav
            [showSummary]="false"
            [groups]="['Cadastros']"
            label="Cadastros"
            idPrefix="more-"
            (navigate)="moreOpen.set(false)"
        />
        <ng-template #footer>
            <div
                class="flex items-center justify-between gap-3 border-t border-line pt-3 pb-[env(safe-area-inset-bottom)]"
            >
                <app-user-badge />
                <p-button label="Sair" icon="pi pi-sign-out" [text]="true" severity="secondary" (onClick)="logout()" />
            </div>
        </ng-template>
    </p-drawer>
</div>
