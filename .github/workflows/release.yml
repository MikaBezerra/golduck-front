# Versionamento automático: a cada push na main, o release-please atualiza um PR de
# release (CHANGELOG.md + versão no package.json). Ao fazer merge desse PR, ele cria a
# tag vX.Y.Z e a release no GitHub.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
