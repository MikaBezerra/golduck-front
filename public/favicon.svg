<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <clipPath id="face">
            <circle cx="256" cy="248" r="236" />
        </clipPath>
        <clipPath id="center">
            <circle cx="256" cy="248" r="176" />
        </clipPath>
    </defs>
    <!-- Contorno escuro e a espessura da moeda (aparece embaixo). -->
    <circle cx="256" cy="256" r="252" fill="#8a3a05" />
    <circle cx="256" cy="262" r="243" fill="#df6206" />
    <!-- Face dourada com faixas de brilho. -->
    <circle cx="256" cy="248" r="236" fill="#fdc52c" />
    <g clip-path="url(#face)" fill="#ffe27c">
        <polygon points="-40,380 380,-40 450,-40 30,380" />
        <polygon points="80,560 560,80 600,80 120,560" />
        <polygon points="-60,250 250,-60 275,-60 -35,250" />
    </g>
    <!-- Borda clara em volta do miolo. -->
    <circle cx="256" cy="248" r="184" fill="#ffd862" />
    <!-- Miolo laranja com a sombra do relevo no alto. -->
    <circle cx="256" cy="248" r="176" fill="#d65c04" />
    <g clip-path="url(#center)">
        <circle cx="256" cy="262" r="176" fill="#f38b07" />
    </g>
    <!-- R$ em relevo. -->
    <g font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900" font-size="196" text-anchor="middle">
        <text x="248" y="332" fill="#c45204">R$</text>
        <text x="256" y="322" fill="#ffd966">R$</text>
    </g>
</svg>
