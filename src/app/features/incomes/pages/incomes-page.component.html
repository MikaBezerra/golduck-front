<app-page-header title="Entradas" subtitle="Quanto entra em cada mês do ano.">
    <div class="flex items-center gap-1">
        <p-button
            icon="pi pi-chevron-left"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            ariaLabel="Ano anterior"
            (onClick)="previousYear()"
        />
        <span class="w-14 text-center text-lg font-semibold" aria-live="polite">{{ year() }}</span>
        <p-button
            icon="pi pi-chevron-right"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            ariaLabel="Próximo ano"
            (onClick)="nextYear()"
        />
    </div>
    <p-button label="Nova entrada" icon="pi pi-plus" (onClick)="openCreate()" />
</app-page-header>

<div class="overflow-hidden surface-card">
    <p-table [value]="rows()" [loading]="incomes.loading()" dataKey="month">
        <ng-template #header>
            <tr>
                <th>Mês</th>
                <th class="text-right">Valor</th>
                <th class="text-right sm:w-32"><span class="sr-only sm:not-sr-only">Ações</span></th>
            </tr>
        </ng-template>

        <ng-template #body let-row>
            <tr [class.!bg-highlight]="row.selected">
                <td>
                    <span [class.font-semibold]="row.selected">{{ row.month | month }}</span>
                </td>
                <td class="text-right tabular-nums">
                    @if (row.income) {
                        <span class="font-medium">{{ row.income.amount | brl }}</span>
                    } @else {
                        <span class="text-muted-color">—</span>
                    }
                </td>
                <td class="text-right whitespace-nowrap">
                    @if (row.income) {
                        <p-button
                            icon="pi pi-pencil"
                            [text]="true"
                            [rounded]="true"
                            severity="secondary"
                            [ariaLabel]="'Editar entrada de ' + (row.month | month)"
                            pTooltip="Editar"
                            tooltipPosition="top"
                            (onClick)="openEdit(row.income)"
                        />
                        <p-button
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            [ariaLabel]="'Excluir entrada de ' + (row.month | month)"
                            pTooltip="Excluir"
                            tooltipPosition="top"
                            (onClick)="remove(row.income)"
                        />
                    } @else {
                        <p-button
                            label="Adicionar"
                            icon="pi pi-plus"
                            size="small"
                            [text]="true"
                            [ariaLabel]="'Adicionar entrada em ' + (row.month | month)"
                            (onClick)="openCreate([row.monthNumber])"
                        />
                    }
                </td>
            </tr>
        </ng-template>

        <ng-template #footer>
            <tr>
                <td class="font-semibold">Total de {{ year() }}</td>
                <td class="text-right font-semibold tabular-nums">{{ total() | brl }}</td>
                <td class="text-right text-sm text-muted-color">
                    <span class="hidden sm:inline">{{ takenMonths().length }} de 12 meses</span>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-income-form-dialog
    [(visible)]="dialogVisible"
    [year]="year()"
    [income]="editing()"
    [takenMonths]="takenMonths()"
    [presetMonths]="presetMonths()"
    (saved)="incomes.reload()"
/>
