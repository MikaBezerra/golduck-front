<div class="flex min-h-screen">
    <!-- Menu lateral fixo (telas grandes) -->
    <aside class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col border-r border-surface bg-surface-0 lg:flex">
        <a routerLink="/" class="flex h-16 items-center gap-2 px-5 text-xl font-semibold text-color no-underline">
            <i class="pi pi-wallet text-2xl text-primary" aria-hidden="true"></i>
            Finanças
        </a>
        <app-sidebar-nav class="flex-1 overflow-y-auto px-3 py-2" />
        <div class="border-t border-surface p-3">
            <app-user-badge />
            <p-button
                label="Sair"
                icon="pi pi-sign-out"
                [text]="true"
                severity="secondary"
                [fluid]="true"
                styleClass="justify-start"
                (onClick)="logout()"
            />
        </div>
    </aside>

    <!-- Menu em gaveta (celular e tablet) -->
    <p-drawer [(visible)]="menuOpen" header="Finanças" styleClass="!w-72">
        <app-sidebar-nav (navigate)="menuOpen.set(false)" />
        <ng-template #footer>
            <app-user-badge />
            <p-button
                label="Sair"
                icon="pi pi-sign-out"
                [text]="true"
                severity="secondary"
                [fluid]="true"
                styleClass="justify-start"
                (onClick)="logout()"
            />
        </ng-template>
    </p-drawer>

    <div class="flex min-w-0 flex-1 flex-col">
        <header
            class="sticky top-0 z-10 flex h-16 items-center gap-2 border-b border-surface bg-surface-0 px-3 sm:px-4 lg:px-6"
        >
            <p-button
                class="lg:hidden"
                icon="pi pi-bars"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                ariaLabel="Abrir menu"
                (onClick)="menuOpen.set(true)"
            />
            <div class="flex-1"></div>
            <app-month-picker />
        </header>

        <main class="flex-1 p-4 lg:p-6">
            <div class="mx-auto max-w-6xl">
                <router-outlet />
            </div>
        </main>
    </div>
</div>
