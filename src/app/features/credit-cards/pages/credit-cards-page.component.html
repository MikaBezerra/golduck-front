<app-page-header title="Cartões" subtitle="Cartões de crédito, ciclo da fatura e sincronização com o Meu Pluggy.">
    <p-button label="Novo cartão" icon="pi pi-plus" (onClick)="openCreate()" />
</app-page-header>

<div class="overflow-hidden surface-card">
    <p-table [value]="cards()" [loading]="loading()" dataKey="id" [rowHover]="true">
        <ng-template #header>
            <tr>
                <th>Nome</th>
                <th>Banco</th>
                <th class="hidden sm:table-cell">Sincronização</th>
                <th class="text-right sm:w-32"><span class="sr-only sm:not-sr-only">Ações</span></th>
            </tr>
        </ng-template>

        <ng-template #body let-card>
            <tr>
                <td>
                    <span class="font-medium">{{ card.name }}</span>
                </td>
                <td>
                    <p-tag [value]="card.bank | cardBank" severity="secondary" />
                </td>
                <td class="hidden sm:table-cell">
                    @if (!card.pluggyItemId) {
                        <span class="text-muted-color">Desligada</span>
                    } @else if (card.sync.error || needsAttention(card)) {
                        <p-tag value="Precisa de atenção" severity="warn" icon="pi pi-exclamation-triangle" />
                    } @else if (card.sync.configured) {
                        <p-tag value="Meu Pluggy" severity="info" />
                    } @else {
                        <span class="text-muted-color">Configuração incompleta</span>
                    }
                </td>
                <td class="text-right whitespace-nowrap">
                    <p-button
                        icon="pi pi-pencil"
                        [text]="true"
                        [rounded]="true"
                        severity="secondary"
                        [ariaLabel]="'Editar ' + card.name"
                        pTooltip="Editar"
                        tooltipPosition="top"
                        (onClick)="openEdit(card)"
                    />
                    <p-button
                        icon="pi pi-ban"
                        [text]="true"
                        [rounded]="true"
                        severity="danger"
                        [ariaLabel]="'Desativar ' + card.name"
                        pTooltip="Desativar"
                        tooltipPosition="top"
                        (onClick)="deactivate(card)"
                    />
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="4" class="py-8 text-center text-muted-color">Nenhum cartão cadastrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-credit-card-form-dialog [(visible)]="dialogVisible" [card]="editing()" (saved)="load()" />
