<p-dialog
    [header]="isEdit() ? 'Editar pessoa' : 'Nova pessoa'"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: '30rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4" novalidate>
        <div class="flex flex-col gap-2">
            <label for="person-name" class="font-medium">Nome</label>
            <input
                pInputText
                id="person-name"
                formControlName="name"
                [maxlength]="nameMaxLength"
                autocomplete="off"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.name" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="person-email" class="font-medium">
                E-mail <span class="font-normal text-muted-color">(opcional)</span>
            </label>
            <input
                pInputText
                id="person-email"
                type="email"
                formControlName="email"
                [maxlength]="emailMaxLength"
                autocomplete="off"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.email" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="person-phone" class="font-medium">
                Celular <span class="font-normal text-muted-color">(opcional)</span>
            </label>
            <input
                pInputText
                id="person-phone"
                type="tel"
                formControlName="phone"
                placeholder="(11) 99999-9999"
                autocomplete="off"
                [fluid]="true"
                aria-describedby="person-phone-help"
            />
            <small id="person-phone-help" class="text-muted-color">
                DDD e número. Para outros países, comece com + e o código do país.
            </small>
            <app-field-error
                [control]="form.controls.phone"
                [messages]="{ phone: 'Telefone inválido. Ex.: (11) 99999-9999' }"
            />
        </div>

        <!-- Botões dentro do <form>: assim "Salvar" e a tecla Enter enviam o formulário. -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
            <p-button type="submit" label="Salvar" icon="pi pi-check" [loading]="saving()" />
        </div>
    </form>
</p-dialog>
