<!-- Desenhos de dinheiro no fundo: só nesta tela. -->
<div class="login-art" aria-hidden="true"></div>

<div class="flex min-h-dvh flex-col">
    <div class="flex flex-1 items-center justify-center p-4">
        <div class="surface-card w-full max-w-sm p-8">
            <div class="mb-8 flex flex-col items-center gap-3 text-center">
                <app-brand-mark size="lg" />
                <div>
                    <h1 class="m-0 text-3xl font-bold"><app-brand-name /></h1>
                    <p class="m-0 mt-1 font-display text-sm font-medium text-cantaloupe/90">Make your money count.</p>
                </div>
                <p class="m-0 text-muted-color">Entre para continuar</p>
            </div>

            @if (errorMessage(); as message) {
                <p-message severity="error" [text]="message" styleClass="mb-4" />
            }

            <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
                <div class="flex flex-col gap-2">
                    <label for="email" class="font-medium">E-mail</label>
                    <input
                        pInputText
                        id="email"
                        type="email"
                        formControlName="email"
                        autocomplete="username"
                        [fluid]="true"
                    />
                    <app-field-error [control]="form.controls.email" />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="font-medium">Senha</label>
                    <p-password
                        inputId="password"
                        formControlName="password"
                        autocomplete="current-password"
                        [feedback]="false"
                        [toggleMask]="true"
                        [fluid]="true"
                    />
                    <app-field-error [control]="form.controls.password" />
                </div>

                <p-button
                    type="submit"
                    label="Entrar"
                    icon="pi pi-sign-in"
                    [loading]="submitting()"
                    [fluid]="true"
                    styleClass="mt-2"
                />
            </form>
        </div>
    </div>
    <app-footer />
</div>
