<p-dialog
    [header]="income() ? 'Editar entrada' : 'Nova entrada'"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: '30rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4" novalidate>
        @if (income(); as current) {
            <p class="m-0">
                Mês: <strong>{{ current.month | month }}</strong>
            </p>
        } @else {
            <div class="flex flex-col gap-2">
                <label for="income-months" class="font-medium">Meses de {{ year() }}</label>
                <p-multiselect
                    inputId="income-months"
                    formControlName="months"
                    [options]="monthOptions()"
                    optionLabel="label"
                    optionValue="value"
                    optionDisabled="disabled"
                    display="chip"
                    placeholder="Escolha os meses"
                    [filter]="false"
                    [maxSelectedLabels]="4"
                    selectedItemsLabel="{0} meses selecionados"
                    appendTo="body"
                    [fluid]="true"
                />
                <small class="text-muted-color">Meses que já têm entrada aparecem bloqueados.</small>
                <app-field-error
                    [control]="form.controls.months"
                    [messages]="{ required: 'Escolha pelo menos um mês' }"
                />
            </div>
        }

        <div class="flex flex-col gap-2">
            <label for="income-amount" class="font-medium">Valor</label>
            <p-inputnumber
                inputId="income-amount"
                formControlName="amount"
                mode="currency"
                currency="BRL"
                locale="pt-BR"
                [min]="0"
                [max]="moneyMax"
                placeholder="R$ 0,00"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.amount" [messages]="moneyMessages" />
        </div>

        <div class="flex justify-end gap-2">
            <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
            <p-button type="submit" label="Salvar" icon="pi pi-check" [loading]="saving()" />
        </div>
    </form>
</p-dialog>
