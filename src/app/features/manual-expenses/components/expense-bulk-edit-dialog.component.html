<p-dialog
    [header]="'Editar ' + expenses().length + ' despesas'"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: '32rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <p class="mt-0 mb-4 text-muted-color">
        Preencha só o que quer mudar. Campos vazios continuam como estão em cada despesa.
    </p>

    @if (nothingToChange()) {
        <p-message severity="warn" text="Preencha pelo menos um campo para alterar." styleClass="mb-4" />
    }

    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4" novalidate>
        <div class="flex flex-col gap-2">
            <label for="bulk-title" class="font-medium">Descrição</label>
            <input
                pInputText
                id="bulk-title"
                formControlName="title"
                [maxlength]="titleMaxLength"
                placeholder="Manter como está"
                autocomplete="off"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.title" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="bulk-amount" class="font-medium">Valor</label>
            <p-inputnumber
                inputId="bulk-amount"
                formControlName="amount"
                mode="currency"
                currency="BRL"
                locale="pt-BR"
                [min]="0"
                [max]="moneyMax"
                placeholder="Manter como está"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.amount" [messages]="moneyMessages" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="bulk-person" class="font-medium">Pessoa</label>
            <p-select
                inputId="bulk-person"
                formControlName="personId"
                [options]="personOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Manter como está"
                [showClear]="true"
                appendTo="body"
                [fluid]="true"
            />
            <app-field-error [control]="form.controls.personId" />
        </div>

        <div class="flex justify-end gap-2">
            <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
            <p-button type="submit" label="Aplicar" icon="pi pi-check" [loading]="saving()" />
        </div>
    </form>
</p-dialog>
